[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent-backend"
version = "0.1.0"
description = "CodeAgent 本地后端与手写 Agent 运行时"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "openai>=3.5,<4.0",
  "pydantic-settings>=2.15,<3.0",
  "PyYAML>=6.0,<7.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.18,<2.0",
  "pytest>=8.4,<10.0",
  "ruff>=0.12,<1.0",
  "types-PyYAML>=6.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "live: 需要真实模型 API 和显式开关的联网测试",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
